{% extends 'magazin_de_bijuterii/baza.html' %}
{% block content %}
  <h2>Adaugă un produs nou</h2>

  {% if messages %}
      {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
  {% endif %}

  <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Salvează produsul</button>
  </form>
{% endblock %}
